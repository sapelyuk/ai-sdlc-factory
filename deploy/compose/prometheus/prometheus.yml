global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:8000']

  - job_name: 'worker'
    static_configs:
      - targets: ['worker:8000']

  - job_name: 'semantic'
    static_configs:
      - targets: ['semantic:8000']

  - job_name: 'gateway-llm'
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway-llm:8040']

  - job_name: 'tool-gateway'
    static_configs:
      - targets: ['tool-gateway:8000']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

