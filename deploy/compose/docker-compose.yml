name: ai-sdlc-factory

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: ai-sdlc-factory-postgres
    environment:
      # Standard PostgreSQL variables (official Docker image convention).
      POSTGRES_DB: ${POSTGRES_DB:-ai_sdlc_factory}
      POSTGRES_USER: ${POSTGRES_USER:-ai_sdlc_factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_sdlc_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_sdlc_factory}"]
      interval: 10s
      timeout: 5s
      retries: 5

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: ai-sdlc-factory-silo
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  silo-init:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: ai-sdlc-factory-silo-init
    depends_on:
      silo:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mcli alias set local http://silo:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mcli mb --ignore-existing local/ai-sdlc-factory &&
      mcli mb --ignore-existing local/ai-sdlc-factory-temp &&
      mcli anonymous set download local/ai-sdlc-factory-temp &&
      echo 'Silo buckets initialized' &&
      exit 0
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    restart: "no"

  nats:
    image: nats:2.10.29-alpine
    container_name: ai-sdlc-factory-nats
    command: ["-js", "-sd", "/data", "-m", "8222", "--cluster_name", "ai-sdlc"]
    volumes:
      - nats-data:/data
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.18
    container_name: ai-sdlc-factory-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    volumes:
      - vault-data:/vault/file
    ports:
      - "${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:0.70.0
    container_name: ai-sdlc-factory-opa
    command:
      - "run"
      - "--server"
      - "--log-level=info"
      - "--set=decision_logs.console=true"
      - "--addr=:8181"
      - "/policies"
    volumes:
      - ../../packages/policy:/policies:ro
    ports:
      - "${OPA_PORT:-8181}:8181"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:latest
    container_name: ai-sdlc-factory-temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ai_sdlc_factory}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-ai_sdlc_dev_password}
      POSTGRES_DBNAME: temporal
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    container_name: ai-sdlc-factory-temporal-ui
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_GRPC_TARGET=temporal:7233
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: ai-sdlc-factory-otel-collector
    command: ["--config", "/etc/otel/config.yaml"]
    volumes:
      - ./otel/config-local-dev.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_METRICS_PORT:-8888}:8888"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.60.0
    container_name: ai-sdlc-factory-jaeger
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_ADMIN_PORT:-14269}:14269"
      - "${JAEGER_OTLP_GRPC:-14317}:4317"
      - "${JAEGER_OTLP_HTTP:-14318}:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: ${JAEGER_MAX_TRACES:-10000}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: ai-sdlc-factory-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_sdlc_factory}:${POSTGRES_PASSWORD:-ai_sdlc_dev_password}@postgres:5432/${POSTGRES_DB:-ai_sdlc_factory}?sslmode=disable
      PORT: "8000"
      LOG_LEVEL: info
      SCHEMA_DIR: /app/packages/contracts/schemas
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ALLOW_LEGACY_AUTH: ${ALLOW_LEGACY_AUTH:-false}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-prod}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.worker
    container_name: ai-sdlc-factory-worker
    environment:
      AI_DB_HOST: postgres
      AI_DB_PORT: "5432"
      # App DSN is assembled from the standard POSTGRES_* variables.
      AI_DB_NAME: ${POSTGRES_DB:-ai_sdlc_factory}
      AI_DB_USER: ${POSTGRES_USER:-ai_sdlc_factory}
      AI_DB_PASSWORD: ${POSTGRES_PASSWORD:-ai_sdlc_dev_password}
      AI_TEMPORAL_HOST: temporal:7233
      AI_NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      vault:
        condition: service_healthy
      opa:
        condition: service_healthy
      temporal:
        condition: service_started

  semantic:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.semantic
    container_name: ai-sdlc-factory-semantic
    environment:
      AI_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  semantic-indexer:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.semantic-indexer
    container_name: ai-sdlc-factory-semantic-indexer
    environment:
      AI_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  diagram:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.diagram
    container_name: ai-sdlc-factory-diagram
    environment:
      AI_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  knowledge:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.knowledge
    container_name: ai-sdlc-factory-knowledge
    environment:
      AI_DB_HOST: postgres
      AI_MINIO_ENDPOINT: silo:9000
    depends_on:
      postgres:
        condition: service_healthy
      silo:
        condition: service_healthy
      silo-init:
        condition: service_completed_successfully

  gateway-llm:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.gateway-llm
    container_name: ai-sdlc-factory-gateway-llm
    environment:
      AI_ANTHROPIC_API_KEY: ${AI_ANTHROPIC_API_KEY:-}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
    depends_on:
      - api

  tool-gateway:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.tool-gateway
    container_name: ai-sdlc-factory-tool-gateway
    depends_on:
      api:
        condition: service_started
      vault:
        condition: service_healthy
      opa:
        condition: service_healthy

  sandbox-manager:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.sandbox-manager
    container_name: ai-sdlc-factory-sandbox-manager
    depends_on:
      - api

  web:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.web
    container_name: ai-sdlc-factory-web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
  nats-data:
  vault-data:
