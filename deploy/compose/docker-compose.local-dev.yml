# local-dev profile: core + OTel + Jaeger, limits for 16GB RAM
# Does NOT include Langfuse, Prometheus, Grafana

services:
  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  silo:
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  nats:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  vault:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  opa:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  temporal:
    image: temporalio/auto-setup:1.26.3
    container_name: ai-sdlc-factory-temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ai_sdlc_factory}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-ai_sdlc_dev_password}
      DBNAME: ${POSTGRES_DB:-ai_sdlc_factory}
      VISIBILITY_DBNAME: temporal_visibility
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development-sql.yaml
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  temporal-ui:
    image: temporalio/ui:2.31.0
    container_name: ai-sdlc-factory-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8080}:8080"
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ── Observability ──────────────────────────────────────────
  otel-collector:
    volumes:
      - ./otel/config-local-dev.yaml:/etc/otel/config.yaml:ro
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  jaeger:
    environment:
      MEMORY_MAX_TRACES: "10000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ── Application Services ───────────────────────────────────
  api:
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  worker:
    environment:
      AI_TEMPORAL_HOST: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  semantic:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  semantic-indexer:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  diagram:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  knowledge:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  gateway-llm:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  tool-gateway:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  sandbox-manager:
    environment:
      RUNTIME: ${SANDBOX_RUNTIME:-runc}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  web:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
