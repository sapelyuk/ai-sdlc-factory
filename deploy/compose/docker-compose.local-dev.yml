version: "3.9"

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: ai-sdlc-factory-otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel/config-local-dev.yaml:/etc/otel/config.yaml
    command: ["--config", "/etc/otel/config.yaml"]
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ai-sdlc-factory-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
    environment:
      - MEMORY_MAX_TRACES=10000
