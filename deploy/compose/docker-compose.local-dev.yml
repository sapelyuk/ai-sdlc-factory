# local-dev profile: core + OTel + Jaeger, limits for 16GB RAM
# Does NOT include Langfuse, Prometheus, Grafana

services:
  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  silo:
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  nats:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  vault:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  opa:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  temporal:
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  temporal-ui:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ── Observability ──────────────────────────────────────────
  otel-collector:
    volumes:
      - ./otel/config-local-dev.yaml:/etc/otel/config.yaml:ro
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  jaeger:
    environment:
      MEMORY_MAX_TRACES: "10000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ── Application Services ───────────────────────────────────
  api:
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  worker:
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  semantic:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  semantic-indexer:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  diagram:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  knowledge:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  gateway-llm:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  tool-gateway:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  sandbox-manager:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  web:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
