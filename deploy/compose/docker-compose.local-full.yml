# local-full profile: core + OTel + Jaeger + Langfuse + Prometheus + Grafana
# For machines with 32+ GB RAM

services:
  # ── Override OTel config for full observability ────────────
  otel-collector:
    volumes:
      - ./otel/config-local-full.yaml:/etc/otel/config.yaml:ro
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  jaeger:
    environment:
      MEMORY_MAX_TRACES: "50000"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ── Langfuse Stack ─────────────────────────────────────────
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: ai-sdlc-factory-langfuse-clickhouse
    ports:
      - "8123:8123"
    environment:
      - CLICKHOUSE_DB=langfuse
      - CLICKHOUSE_USER=langfuse
      - CLICKHOUSE_PASSWORD=langfuse
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  langfuse-postgres:
    image: postgres:18-alpine
    container_name: ai-sdlc-factory-langfuse-postgres
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  langfuse-redis:
    image: redis:7-alpine
    container_name: ai-sdlc-factory-langfuse-redis
    volumes:
      - langfuse-redis-data:/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  langfuse-web:
    image: langfuse/langfuse:latest
    container_name: ai-sdlc-factory-langfuse-web
    ports:
      - "3030:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      - REDIS_HOST=langfuse-redis
      - REDIS_PORT=6379
      - NEXTAUTH_SECRET=langfuse-nextauth-secret
      - SALT=langfuse
      - HASHED_SALT=langfuse
    depends_on:
      - langfuse-postgres
      - langfuse-redis
      - langfuse-clickhouse
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  langfuse-worker:
    image: langfuse/langfuse-worker:latest
    container_name: ai-sdlc-factory-langfuse-worker
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      - REDIS_HOST=langfuse-redis
      - REDIS_PORT=6379
    depends_on:
      - langfuse-postgres
      - langfuse-redis
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-sdlc-factory-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ai-sdlc-factory-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ── Tool Gateway: close port 8030 in production-like mode ──
  # The base compose.yml exposes port 8030 for debugging. In local-full
  # (production-like) the port is not exposed; a reverse proxy handles
  # external traffic (see README.md Trust model).
  tool-gateway:
    ports: []

volumes:
  langfuse-clickhouse-data:
  langfuse-postgres-data:
  langfuse-redis-data:
  grafana-data:
