name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read

# All Go modules under apps/* are checked. Add a new module to `matrix.app`
# (and to apps/ if needed) to have lint, test and build run for it.
jobs:
  lint:
    name: Lint (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, semantic]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: apps/${{ matrix.app }}/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: apps/${{ matrix.app }}

  test:
    name: Test (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        app: [api, semantic]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: apps/${{ matrix.app }}/go.sum

      - name: Run tests
        working-directory: apps/${{ matrix.app }}
        run: |
          go test -v -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./apps/${{ matrix.app }}/coverage.txt
          flags: ${{ matrix.app }}
          fail_ci_if_error: false

  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        app: [api, semantic]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: apps/${{ matrix.app }}/go.sum

      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: |
          go build -v ./...

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for frontend package
        id: frontend
        run: |
          if [ -f apps/web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No apps/web frontend package found; skipping frontend checks."
          fi

      - name: Set up Node.js
        if: steps.frontend.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        if: steps.frontend.outputs.present == 'true'
        working-directory: apps/web
        run: npm ci

      - name: Run linter
        if: steps.frontend.outputs.present == 'true'
        working-directory: apps/web
        run: npm run lint

      - name: Build
        if: steps.frontend.outputs.present == 'true'
        working-directory: apps/web
        run: npm run build

  cyrillic-check:
    name: English-only check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cyrillic characters
        run: |
          echo "Checking for Cyrillic characters in tracked files..."
          
          # Search for Cyrillic in all text files, excluding node_modules and .git
          MATCHES=$(grep -rI "[А-Яа-я]" \
            --include="*.md" \
            --include="*.yaml" \
            --include="*.yml" \
            --include="*.json" \
            --include="*.go" \
            --include="*.ts" \
            --include="*.tsx" \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            . || true)
            
          if [ -n "$MATCHES" ]; then
            echo "::error::Cyrillic characters found. The repository is English-only."
            echo "$MATCHES"
            exit 1
          fi
          
          echo "OK: no Cyrillic characters found."
