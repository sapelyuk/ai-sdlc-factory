name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read

# All Go modules under apps/* are checked. Add a new module to `matrix.app`
# (and to apps/ if needed) to have lint, test and build run for it.
jobs:
  lint:
    name: Lint (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, semantic, gateway-llm, tool-gateway, sandbox-manager]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: apps/${{ matrix.app }}/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: apps/${{ matrix.app }}

  test:
    name: Test (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        app: [api, semantic, gateway-llm, tool-gateway, sandbox-manager]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: apps/${{ matrix.app }}/go.sum

      - name: Run tests
        working-directory: apps/${{ matrix.app }}
        run: |
          go test -v -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./apps/${{ matrix.app }}/coverage.txt
          flags: ${{ matrix.app }}
          fail_ci_if_error: false

  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        app: [api, semantic, gateway-llm, tool-gateway, sandbox-manager]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: apps/${{ matrix.app }}/go.sum

      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: |
          go build -v ./...

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for frontend package
        id: frontend
        run: |
          if [ -f apps/web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No apps/web frontend package found; skipping frontend checks."
          fi

      - name: Set up Node.js
        if: steps.frontend.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        if: steps.frontend.outputs.present == 'true'
        working-directory: apps/web
        run: npm ci

      - name: Run linter
        if: steps.frontend.outputs.present == 'true'
        working-directory: apps/web
        run: npm run lint

      - name: Build
        if: steps.frontend.outputs.present == 'true'
        working-directory: apps/web
        run: npm run build

  cyrillic-check:
    name: English-only check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cyrillic characters
        run: |
          python3 - <<'PY'
          import os
          import sys
          def is_cyrillic(char):
              cp = ord(char)
              return (0x0400 <= cp <= 0x04FF) or (0x0500 <= cp <= 0x052F)
          
          errors = []
          extensions = ('.md', '.yaml', '.yml', '.json', '.go', '.ts', '.tsx', '.env', '.sh', '.ps1', '.rego', '.sql', '.drawio', '.css')
          for root, dirs, files in os.walk('.'):
              if '.git' in root or 'node_modules' in root:
                  continue
              for file in files:
                  if file.endswith(extensions) or file.startswith('.env'):
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, 'r', encoding='utf-8') as f:
                              for i, line in enumerate(f, 1):
                                  if any(is_cyrillic(c) for c in line):
                                      errors.append(f"{filepath}:{i}: {line.strip()}")
                      except Exception:
                          pass
          
          if errors:
              print("::error::Cyrillic characters found. Repository is English-only.")
              for err in errors:
                  print(err)
              sys.exit(1)
          print("OK: no Cyrillic characters found.")
          PY

  # Aggregate job so the branch-protection "ci" context is satisfied.
  # It runs after all other jobs and succeeds only if they all succeed.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - build
      - frontend-lint
      - cyrillic-check
    if: always()
    steps:
      - name: Verify all required checks passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more required checks failed or were cancelled."
            exit 1
          fi
          echo "All required checks passed."
