apiVersion: ai-sdlc-factory/v1
kind: Role
metadata:
  name: backend-developer
  version: 1.0.0
  description: Implements backend services and maintains automated tests.
spec:
  system_prompt_ref: prompts/roles/backend-developer.md
  inputs:
    - name: ticket
      artifact_type: ticket
    - name: am_v1
      artifact_type: am
  outputs:
    - name: code_branch
      artifact_type: branch
    - name: pr
      artifact_type: pr
  model:
    capability: code-strong
  tools:
    allow: [git.clone, git.branch, git.commit, git.push, sandbox.exec, fs.read, fs.write, test.run]
    deny: [deploy.prod, secrets.read, git.push_protected]
  knowledge_scopes: [platform, team, project, role]
  limits:
    max_steps: 120
    max_cost_usd: 8.0
    max_wall_minutes: 60
  autonomy: balanced
  tools_policy: write_capable
