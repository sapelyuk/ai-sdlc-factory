openapi: 3.1.0
info:
  title: ai-sdlc-factory Platform API
  version: 1.0.0
  description: |
    Unified Platform API with JWT authentication, RBAC, and Registry endpoints.
    Roles: owner, admin, operator, viewer (hierarchical).
servers:
  - url: http://localhost:8000
    description: Local development
security:
  - bearerAuth: []
paths:
  # ── Auth ──────────────────────────────────────────────────────────
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate user and return JWT
      description: Authenticates a user with email and password and returns a JWT and user identity.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              success:
                value:
                  email: admin@example.com
                  password: admin
      responses:
        "200":
          description: JWT token and user info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ── Health ────────────────────────────────────────────────────────
  /healthz:
    get:
      servers:
        - url: http://localhost:8000
          description: Platform API
        - url: http://localhost:8010
          description: Semantic Service
        - url: http://localhost:8030
          description: Tool Gateway
        - url: http://localhost:8040
          description: LLM Gateway
        - url: http://localhost:8060
          description: Sandbox Manager
      operationId: healthz
      summary: Liveness probe
      description: Reports whether the service process is alive.
      security: []
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      servers:
        - url: http://localhost:8000
          description: Platform API
        - url: http://localhost:8010
          description: Semantic Service
        - url: http://localhost:8030
          description: Tool Gateway
        - url: http://localhost:8040
          description: LLM Gateway
        - url: http://localhost:8060
          description: Sandbox Manager
      operationId: readyz
      summary: Readiness probe
      description: Reports whether the service can accept requests and reach its required dependencies.
      security: []
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
        "503":
          description: Database unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Metrics ───────────────────────────────────────────────────────
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics endpoint
      description: Exposes service metrics in Prometheus text format.
      security: []
      responses:
        "200":
          description: Prometheus metrics.
          content:
            text/plain:
              schema:
                type: string

  # ── Registry: Roles ───────────────────────────────────────────────
  /api/v1/registry/roles:
    get:
      operationId: listRoles
      summary: List roles
      description: Returns roles in the active workspace, optionally filtered by category and status. Requires viewer role or higher.
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/Status"
      responses:
        "200":
          description: Roles in the active workspace.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createRole
      summary: Create a new role (admin+)
      description: Creates a draft role in the active workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Created draft role at version 1.0.0.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/registry/roles/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getRole
      summary: Get a role by ID
      description: Returns a role by its identifier in the active workspace.
      responses:
        "200":
          description: Role version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      operationId: updateRoleSpec
      summary: Update role spec (admin+)
      description: Replaces the specification of a role in the active workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleSpecUpdate"
      responses:
        "200":
          description: Updated role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/registry/roles/{name}/{version}:
    parameters:
      - $ref: "#/components/parameters/Name"
      - $ref: "#/components/parameters/Version"
    get:
      operationId: getRoleByNameAndVersion
      summary: Get a role by name and version
      description: Returns a role by its name and semantic version in the active workspace.
      responses:
        "200":
          description: Role version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/registry/roles/{id}/status:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateRoleStatus
      summary: Update role status (admin+); approver from JWT sub
      description: Changes a role status subject to the registry transition and approval rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Updated role status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/registry/roles/{id}/clone:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: cloneRole
      summary: Clone role to next minor version (admin+)
      description: Creates a draft role as the next minor version of the specified role.
      responses:
        "201":
          description: New draft role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/registry/roles/{id}/revert:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: revertRole
      summary: Revert role to previous version (admin+)
      description: Creates a draft role based on the previous version of the specified role.
      responses:
        "201":
          description: New draft role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

