  # ── LLM Gateway ───────────────────────────────────────────────────
  /v1/llm/chat:
    post:
      servers:
        - url: http://localhost:8040
          description: LLM Gateway
      operationId: createChatCompletion
      summary: Create a chat completion
      description: Sends a chat request to the configured model profile and returns the selected provider response and usage.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AuthorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMChatRequest"
      responses:
        "200":
          description: Chat completion and token and cost usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMChatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          description: All provider attempts failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMChatResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Tool Gateway (MCP) ────────────────────────────────────────────
  /mcp:
    post:
      servers:
        - url: http://localhost:8030
          description: Tool Gateway
      operationId: handleMCPRequest
      summary: Handle an MCP JSON-RPC request
      description: Handles an MCP request, applying policy authorization to tool calls.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AgentHeader"
        - $ref: "#/components/parameters/AgentRoleHeader"
        - $ref: "#/components/parameters/AuthorHeaderOptional"
        - $ref: "#/components/parameters/ApproverHeader"
        - $ref: "#/components/parameters/AutonomyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPRequest"
      responses:
        "200":
          description: MCP JSON-RPC response or event stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPResponse"
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Request body exceeds the accepted size limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      servers:
        - url: http://localhost:8030
          description: Tool Gateway
      operationId: openMCPEventStream
      summary: Open an MCP event stream
      description: Opens the MCP server-to-client event stream for the caller.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AgentHeader"
        - $ref: "#/components/parameters/AgentRoleHeader"
        - $ref: "#/components/parameters/AuthorHeaderOptional"
        - $ref: "#/components/parameters/ApproverHeader"
        - $ref: "#/components/parameters/AutonomyHeader"
      responses:
        "200":
          description: MCP server-to-client event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      servers:
        - url: http://localhost:8030
          description: Tool Gateway
      operationId: closeMCPSession
      summary: Close an MCP session
      description: Closes the caller's MCP transport session.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AgentHeader"
        - $ref: "#/components/parameters/AgentRoleHeader"
        - $ref: "#/components/parameters/AuthorHeaderOptional"
        - $ref: "#/components/parameters/ApproverHeader"
        - $ref: "#/components/parameters/AutonomyHeader"
      responses:
        "200":
          description: MCP session closed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /admin/audit/verify:
    get:
      servers:
        - url: http://localhost:8030
          description: Tool Gateway
      operationId: verifyAuditChain
      summary: Verify the audit chain
      description: Verifies the hash chain for the specified workspace; requires an admin caller identity.
      security: []
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AgentHeader"
        - $ref: "#/components/parameters/AgentRoleHeader"
        - $ref: "#/components/parameters/AuthorHeaderOptional"
        - $ref: "#/components/parameters/ApproverHeader"
        - $ref: "#/components/parameters/AutonomyHeader"
      responses:
        "200":
          description: Audit chain verification result; a broken chain is reported in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Sandbox Manager ───────────────────────────────────────────────
  /v1/sandboxes/exec:
    post:
      servers:
        - url: http://localhost:8060
          description: Sandbox Manager
      operationId: executeSandboxCommand
      summary: Execute a command in a sandbox
      description: Creates an isolated sandbox for a task run, executes the command, and destroys the sandbox.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AuthorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxExecutionRequest"
      responses:
        "200":
          description: Command execution result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxExecutionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          description: Sandbox command timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Semantic Service ──────────────────────────────────────────────
  /v1/nodes:
    post:
      servers:
        - url: http://localhost:8010
          description: Semantic Service
      operationId: createSemanticNode
      summary: Create a semantic node
      description: Creates a semantic graph node in the caller's workspace.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AuthorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSemanticNodeRequest"
      responses:
        "201":
          description: Created semantic node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      servers:
        - url: http://localhost:8010
          description: Semantic Service
      operationId: listSemanticNodes
      summary: List semantic nodes
      description: Lists semantic nodes, optionally filtering by layer or traversing a subgraph from a root node.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AuthorHeader"
        - name: layer
          in: query
          schema:
            type: string
            enum: [SLP, SLPr, AM]
        - name: root
          in: query
          schema:
            type: string
            format: uuid
        - name: depth
          in: query
          description: Non-negative traversal depth used when root is supplied.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Semantic nodes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SemanticNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/nodes/{id}:
    patch:
      servers:
        - url: http://localhost:8010
          description: Semantic Service
      operationId: updateSemanticNode
      summary: Update a semantic node
      description: Updates the mutable fields of a semantic node by identifier.
      security: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AuthorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSemanticNodeRequest"
      responses:
        "200":
          description: Updated semantic node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/edges:
    post:
      servers:
        - url: http://localhost:8010
          description: Semantic Service
      operationId: createSemanticEdge
      summary: Create a semantic edge
      description: Creates an edge between semantic graph nodes in the caller's workspace.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AuthorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSemanticEdgeRequest"
      responses:
        "201":
          description: Semantic edge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/edges/{id}:
    delete:
      servers:
        - url: http://localhost:8010
          description: Semantic Service
      operationId: deleteSemanticEdge
      summary: Delete a semantic edge
      description: Deletes a semantic graph edge by identifier.
      security: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AuthorHeader"
      responses:
        "200":
          description: Semantic edge deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
    Version:
      name: version
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    WorkspaceHeader:
      name: X-Workspace-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    AuthorHeader:
      name: X-Author-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    AuthorHeaderOptional:
      name: X-Author-ID
      in: header
      required: false
      description: Defaults to the caller's agent ID when omitted.
      schema:
        type: string
        format: uuid
    AgentHeader:
      name: X-Agent-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    AgentRoleHeader:
      name: X-Agent-Role
      in: header
      required: true
      schema:
        type: string
    ApproverHeader:
      name: X-Approver-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    AutonomyHeader:
      name: X-Autonomy-Level
      in: header
      required: false
      description: Defaults to R0 when omitted.
      schema:
        type: string
        enum: [R0, R1, R2, R3]
  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid authentication token or caller identity.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient role or approver equals author.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found in the active workspace.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Invalid status transition.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Status:
      type: string
      enum: [draft, approved, deprecated]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT bearer token.
        user:
          type: object
          required: [id, email, role]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            role:
              type: string
              enum: [owner, admin, operator, viewer]
    StatusUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/Status"
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required: [metadata, spec]
      properties:
        apiVersion:
          type: string
          enum: [ai-sdlc-factory/v1]
        kind:
          type: string
          enum: [Role]
        metadata:
          type: object
          additionalProperties: false
          required: [name, category]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 128
            version:
              type: string
              enum: ["1.0.0"]
            category:
              type: string
              enum: [product, design, engineering, qa, devops, research, security]
        spec:
          $ref: ../schemas/role.schema.json
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [metadata, spec]
      properties:
        apiVersion:
          type: string
          enum: [ai-sdlc-factory/v1]
        kind:
          type: string
          enum: [Team]
        metadata:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 128
            version:
              type: string
              enum: ["1.0.0"]
        spec:
          $ref: ../schemas/team.schema.json
    CreateProcessRequest:
      type: object
      additionalProperties: false
      required: [metadata, spec]
      properties:
        apiVersion:
          type: string
          enum: [ai-sdlc-factory/v1]
        kind:
          type: string
          enum: [Process]
        metadata:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 128
            version:
              type: string
              enum: ["1.0.0"]
        spec:
          $ref: ../schemas/process.schema.json
    RoleSpecUpdate:
      type: object
      additionalProperties: false
      required: [spec]
      properties:
        spec:
          $ref: ../schemas/role.schema.json
    TeamSpecUpdate:
      type: object
      additionalProperties: false
      required: [spec]
      properties:
        spec:
          $ref: ../schemas/team.schema.json
    ProcessSpecUpdate:
      type: object
      additionalProperties: false
      required: [spec]
      properties:
        spec:
          $ref: ../schemas/process.schema.json
    Role:
      type: object
      required: [id, workspace_id, name, version, category, spec, status, author_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
        category:
          type: string
        spec:
          $ref: ../schemas/role.schema.json
        status:
          $ref: "#/components/schemas/Status"
        author_id:
          type: string
          format: uuid
        approver_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Team:
      type: object
      required: [id, workspace_id, name, version, spec, status, author_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
        spec:
          $ref: ../schemas/team.schema.json
        status:
          $ref: "#/components/schemas/Status"
        author_id:
          type: string
          format: uuid
        approver_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Process:
      type: object
      required: [id, workspace_id, name, version, spec, status, author_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
        spec:
          $ref: ../schemas/process.schema.json
        status:
          $ref: "#/components/schemas/Status"
        author_id:
          type: string
          format: uuid
        approver_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LLMChatRequest:
      type: object
      required: [profile, messages]
      properties:
        profile:
          type: string
          minLength: 1
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/LLMToolDefinition"
        run_id:
          type: [string, "null"]
          format: uuid
        task_id:
          type: [string, "null"]
          format: uuid
        agent_id:
          type: [string, "null"]
          format: uuid
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
        content:
          type: string
    LLMToolDefinition:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        input_schema:
          type: object
          additionalProperties: true
    LLMChatResponse:
      type: object
      required: [logical_call_id, status, model_used, provider_used, content, usage]
      properties:
        logical_call_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [succeeded, failed, partial]
        model_used:
          type: string
        provider_used:
          type: string
        content:
          type: string
        usage:
          $ref: "#/components/schemas/LLMUsage"
    LLMUsage:
      type: object
      required: [tokens_in, tokens_out, cost_usd, total_tokens_in, total_tokens_out, total_cost_usd]
      properties:
        tokens_in:
          type: integer
        tokens_out:
          type: integer
        cost_usd:
          type: number
        total_tokens_in:
          type: integer
        total_tokens_out:
          type: integer
        total_cost_usd:
          type: number
    MCPRequest:
      description: A JSON-RPC 2.0 request or a batch of requests handled by the MCP transport.
      oneOf:
        - $ref: "#/components/schemas/JSONRPCRequest"
        - type: array
          items:
            $ref: "#/components/schemas/JSONRPCRequest"
    JSONRPCRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
        params:
          type: object
          additionalProperties: true
      additionalProperties: true
    MCPResponse:
      description: A JSON-RPC 2.0 response, batch, or notification acknowledgement.
      oneOf:
        - $ref: "#/components/schemas/JSONRPCResponse"
        - type: array
          items:
            $ref: "#/components/schemas/JSONRPCResponse"
    JSONRPCResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
              additionalProperties: true
      additionalProperties: true
    AuditVerification:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, broken]
        error:
          type: string
    SandboxExecutionRequest:
      type: object
      required: [task_run_id, command]
      properties:
        task_run_id:
          type: string
          format: uuid
        command:
          type: array
          minItems: 1
          items:
            type: string
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          default: 300
        stdout_limit_bytes:
          type: integer
          minimum: 1
          maximum: 16777216
          default: 1048576
    SandboxExecutionResponse:
      type: object
      required: [status, stdout, stderr, exit_code, stdout_truncated, stderr_truncated]
      properties:
        status:
          type: string
          enum: [success, error]
        stdout:
          type: string
        stderr:
          type: string
        exit_code:
          type: integer
        stdout_truncated:
          type: boolean
        stderr_truncated:
          type: boolean
    CreateSemanticNodeRequest:
      type: object
      required: [layer, kind, label]
      properties:
        layer:
          type: string
          enum: [SLP, SLPr, AM]
        kind:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        props:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [draft, active, deprecated, deleted]
    UpdateSemanticNodeRequest:
      type: object
      properties:
        kind:
          type: string
          maxLength: 128
        label:
          type: string
          maxLength: 512
        props:
          type: object
          additionalProperties: true
    SemanticNode:
      type: object
      required: [id, workspace_id, layer, kind, label, props, version, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        layer:
          type: string
          enum: [SLP, SLPr, AM]
        kind:
          type: string
        label:
          type: string
        props:
          type: object
          additionalProperties: true
        version:
          type: integer
        status:
          type: string
          enum: [draft, active, deprecated, deleted]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateSemanticEdgeRequest:
      type: object
      required: [src_id, dst_id, kind]
      properties:
        src_id:
          type: string
          format: uuid
        dst_id:
          type: string
          format: uuid
        kind:
          type: string
        props:
          type: object
          additionalProperties: true
    SemanticMutationResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [created, deleted]
