openapi: 3.1.0
info:
  title: ai-sdlc-factory Registry API
  version: 1.0.0
  description: Versioned registry for roles, teams, and SDLC processes.
servers:
  - url: http://localhost:8000
security:
  - WorkspaceID: []
    AuthorID: []
paths:
  /api/v1/registry/roles:
    get:
      operationId: listRoles
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/Status"
      responses:
        "200":
          description: Roles in the active workspace.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Created draft role at version 1.0.0.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/InvalidSpec"
  /api/v1/registry/roles/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getRole
      responses:
        "200":
          description: Role version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateRoleSpec
      description: Updates the specification only while the role is a draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleSpecUpdate"
      responses:
        "200":
          description: Updated role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/Immutable"
        "422":
          $ref: "#/components/responses/InvalidSpec"
  /api/v1/registry/roles/{name}/{version}:
    parameters:
      - $ref: "#/components/parameters/Name"
      - $ref: "#/components/parameters/Version"
    get:
      operationId: getRoleByNameAndVersion
      responses:
        "200":
          description: Role version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/registry/roles/{id}/status:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateRoleStatus
      security:
        - WorkspaceID: []
          AuthorID: []
          ApproverID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Updated role status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/registry/roles/{id}/clone:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: cloneRole
      responses:
        "201":
          description: New draft role with the next minor version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/registry/roles/{id}/revert:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: revertRole
      responses:
        "201":
          description: New draft role containing the previous version's specification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/registry/teams:
    get:
      operationId: listTeams
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/Status"
      responses:
        "200":
          description: Teams in the active workspace.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Created draft team at version 1.0.0.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/InvalidSpec"
  /api/v1/registry/teams/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getTeam
      responses:
        "200":
          description: Team version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTeamSpec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamSpecUpdate"
      responses:
        "200":
          description: Updated team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/Immutable"
        "422":
          $ref: "#/components/responses/InvalidSpec"
  /api/v1/registry/teams/{name}/{version}:
    parameters:
      - $ref: "#/components/parameters/Name"
      - $ref: "#/components/parameters/Version"
    get:
      operationId: getTeamByNameAndVersion
      responses:
        "200":
          description: Team version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/registry/teams/{id}/status:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateTeamStatus
      security:
        - WorkspaceID: []
          AuthorID: []
          ApproverID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Updated team status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/registry/teams/{id}/clone:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: cloneTeam
      responses:
        "201":
          description: New draft team with the next minor version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/registry/teams/{id}/revert:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: revertTeam
      responses:
        "201":
          description: New draft team containing the previous version's specification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/registry/processes:
    get:
      operationId: listProcesses
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/Status"
      responses:
        "200":
          description: Processes in the active workspace.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Process"
    post:
      operationId: createProcess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProcessRequest"
      responses:
        "201":
          description: Created draft process at version 1.0.0.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/InvalidSpec"
  /api/v1/registry/processes/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getProcess
      responses:
        "200":
          description: Process version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProcessSpec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessSpecUpdate"
      responses:
        "200":
          description: Updated process.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/Immutable"
        "422":
          $ref: "#/components/responses/InvalidSpec"
  /api/v1/registry/processes/{name}/{version}:
    parameters:
      - $ref: "#/components/parameters/Name"
      - $ref: "#/components/parameters/Version"
    get:
      operationId: getProcessByNameAndVersion
      responses:
        "200":
          description: Process version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/registry/processes/{id}/status:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateProcessStatus
      security:
        - WorkspaceID: []
          AuthorID: []
          ApproverID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Updated process status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/registry/processes/{id}/clone:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: cloneProcess
      responses:
        "201":
          description: New draft process with the next minor version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/registry/processes/{id}/revert:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: revertProcess
      responses:
        "201":
          description: New draft process containing the previous version's specification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    WorkspaceID:
      type: apiKey
      in: header
      name: X-Workspace-ID
    AuthorID:
      type: apiKey
      in: header
      name: X-Author-ID
    ApproverID:
      type: apiKey
      in: header
      name: X-Approver-ID
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
    Version:
      name: version
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  responses:
    BadRequest:
      description: Invalid request or tenant headers.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidSpec:
      description: Specification does not satisfy its JSON-Schema.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Immutable:
      description: Published registry versions cannot be modified.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Registry item not found in the active workspace.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Author cannot approve their own version.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Invalid status transition.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Status:
      type: string
      enum: [draft, approved, deprecated]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    StatusUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/Status"
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required: [metadata, spec]
      properties:
        apiVersion:
          type: string
          enum: [ai-sdlc-factory/v1]
        kind:
          type: string
          enum: [Role]
        metadata:
          type: object
          additionalProperties: false
          required: [name, category]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 128
            version:
              type: string
              enum: ["1.0.0"]
            category:
              type: string
              enum: [product, design, engineering, qa, devops, research, security]
        spec:
          $ref: ../schemas/role.schema.json
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [metadata, spec]
      properties:
        apiVersion:
          type: string
          enum: [ai-sdlc-factory/v1]
        kind:
          type: string
          enum: [Team]
        metadata:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 128
            version:
              type: string
              enum: ["1.0.0"]
        spec:
          $ref: ../schemas/team.schema.json
    CreateProcessRequest:
      type: object
      additionalProperties: false
      required: [metadata, spec]
      properties:
        apiVersion:
          type: string
          enum: [ai-sdlc-factory/v1]
        kind:
          type: string
          enum: [Process]
        metadata:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 128
            version:
              type: string
              enum: ["1.0.0"]
        spec:
          $ref: ../schemas/process.schema.json
    RoleSpecUpdate:
      type: object
      additionalProperties: false
      required: [spec]
      properties:
        spec:
          $ref: ../schemas/role.schema.json
    TeamSpecUpdate:
      type: object
      additionalProperties: false
      required: [spec]
      properties:
        spec:
          $ref: ../schemas/team.schema.json
    ProcessSpecUpdate:
      type: object
      additionalProperties: false
      required: [spec]
      properties:
        spec:
          $ref: ../schemas/process.schema.json
    Role:
      type: object
      required: [id, workspace_id, name, version, category, spec, status, author_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
        category:
          type: string
        spec:
          $ref: ../schemas/role.schema.json
        status:
          $ref: "#/components/schemas/Status"
        author_id:
          type: string
          format: uuid
        approver_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Team:
      type: object
      required: [id, workspace_id, name, version, spec, status, author_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
        spec:
          $ref: ../schemas/team.schema.json
        status:
          $ref: "#/components/schemas/Status"
        author_id:
          type: string
          format: uuid
        approver_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Process:
      type: object
      required: [id, workspace_id, name, version, spec, status, author_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
        spec:
          $ref: ../schemas/process.schema.json
        status:
          $ref: "#/components/schemas/Status"
        author_id:
          type: string
          format: uuid
        approver_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
